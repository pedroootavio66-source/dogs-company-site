<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">Atendimento veterinário 24 horas</title>
  <desc id="desc">Selo Dog's Company em azul-marinho e laranja.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f5f0e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#07101d" flood-opacity=".24"/>
    </filter>
  </defs>
  <circle cx="240" cy="232" r="218" fill="#e67a00" filter="url(#shadow)"/>
  <circle cx="240" cy="232" r="204" fill="url(#paper)" stroke="#14233a" stroke-width="5"/>
  <circle cx="240" cy="232" r="190" fill="none" stroke="#e67a00" stroke-width="2" stroke-dasharray="2 8"/>
  <text x="240" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="142" font-weight="800" letter-spacing="-8" fill="#14233a">24</text>
  <text x="240" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="5" fill="#d86f00">HORAS</text>
  <path d="M120 302H360" stroke="#d9dfe5" stroke-width="2"/>
  <text x="240" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#263449">CUIDADO E ATENÇÃO</text>
  <image href="dogs-company-logo-transparent.png" x="128" y="348" width="224" height="88" preserveAspectRatio="xMidYMid meet"/>
</svg>
